name: pedidos

services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pedidos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pedidos}
      POSTGRES_DB: ${POSTGRES_DB:-pedidos}
    ports:
      # Porta do host diferente de 5432 para não colidir com outros Postgres locais.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pedidos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pedidos_pgdata:
